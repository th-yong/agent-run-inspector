<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run Inspector</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 rx=%273%27 fill=%27%23111%27/%3E%3C/svg%3E">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="/app.css">
<script type="module" src="/app.js"></script>
</head>
<body data-view="list">
<header class="top">
  <div class="brand"><i></i><span id="appName"></span></div>
  <div class="spacer"></div>
  <span class="live" id="live"><span class="dot" id="liveDot"></span><span id="liveText"></span></span>
  <button class="icon-btn redact-btn" id="redactBtn" type="button" aria-pressed="false" hidden></button>
  <button class="icon-btn" id="themeBtn" type="button">◐</button>
</header>
<div class="auth-lost" id="authLost" role="alert" hidden></div>
<div class="app">
  <aside class="list" id="list" aria-label="Sessions"></aside>
  <main class="main" id="main"></main>
</div>
</body>
</html>
