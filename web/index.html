<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run Inspector</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="/app.css">
<script type="module" src="/app.js"></script>
</head>
<body data-view="list">
<header class="top">
  <div class="brand"><!-- same mark as the app icon (scripts/build-app-icons.js) --><svg class="brand-mark" viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="brandMarkG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4c6ef5"/><stop offset="1" stop-color="#0c8599"/></linearGradient></defs><rect width="100" height="100" rx="22.5" fill="url(#brandMarkG)"/><path d="M50 31L31 69M50 31L69 69" stroke="#fff" stroke-width="6.4" stroke-linecap="round"/><circle cx="50" cy="31" r="9.5" fill="#fff"/><circle cx="31" cy="69" r="8.5" fill="#fff"/><circle cx="69" cy="69" r="8.5" fill="#fff"/></svg><span id="appName"></span><span class="ver num" id="ver"></span><span class="upd" id="upd" hidden></span></div>
  <div class="spacer"></div>
  <span class="live" id="live"><span class="dot" id="liveDot"></span><span id="liveText"></span></span>
  <button class="icon-btn" id="themeBtn" type="button">◐</button>
</header>
<div class="auth-lost" id="authLost" role="alert" hidden></div>
<div class="app">
  <aside class="list" id="list" aria-label="Sessions"></aside>
  <main class="main" id="main"></main>
</div>
</body>
</html>
